services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${DBFLOW_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: dbflow
      POSTGRES_PASSWORD: ${DBFLOW_POSTGRES_PASSWORD:-dbflow_local_only}
      POSTGRES_DB: dbflow_demo
    volumes:
      - dbflow_postgres_data:/var/lib/postgresql/data
      - ./db/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  dbflow_postgres_data:
